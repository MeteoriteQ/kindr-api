<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | FundGuru</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --green: #f47600;
      --green-dark: #363636;
      --ink: #222222;
      --muted: #68727d;
      --white: #ffffff;
      --line: rgba(34, 34, 34, 0.12);
      --shadow: 0 24px 70px rgba(34, 34, 34, 0.14);
    }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 5.5rem 1rem 2rem;
      font-family: Calibri, Arial, sans-serif;
      background: #f7faf7;
      color: var(--ink);
    }

     .logo {
       width: 9rem;
       height: 4rem;
       padding-top: 0.5rem;
       display: flex;
       align-items: center;
       font-size: 1.4rem;
       font-weight: 900;
       color: var(--white);

        position: fixed;
      top: 1.25rem;
      left: 1.25rem;
      z-index: 10;
      color: var(--green);
      font-size: 1.45rem;
      font-weight: 900;
      }

    .logo img {
       height: 100%;
       width: 100%;
       object-fit: contain;
       transition: filter 0.25s ease;
      }


    a { color: inherit; text-decoration: none; }
    .home-logo {
      position: fixed;
      top: 1.25rem;
      left: 1.25rem;
      z-index: 10;
      color: var(--green);
      font-size: 1.45rem;
      font-weight: 900;
    }
    .auth-shell {
      width: min(100%, 56rem);
      display: grid;
      grid-template-columns: 0.9fr 1fr;
      overflow: hidden;
      border-radius: 1.25rem;
      background: var(--white);
      box-shadow: var(--shadow);
    }
    .auth-panel {
      padding: 2.3rem;
      background: #182018;
      color: var(--white);
    }
    .auth-panel h1 {
      margin-top: 4.2rem;
      font-size: 2.25rem;
      line-height: 1;
      font-weight: 900;
    }
    .auth-panel p {
      margin-top: 1rem;
      color: rgba(255,255,255,0.72);
      font-size: 1rem;
      line-height: 1.5;
    }
    .panel-mark {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--green);
      font-size: 1.6rem;
      font-weight: 900;
    }
    .panel-mark span {
      width: 0.55rem;
      height: 0.55rem;
      border-radius: 50%;
      background: var(--green);
    }
    .form-wrap {
      padding: 2.3rem;
    }
    .form-wrap h2 {
      font-size: 1.75rem;
      font-weight: 900;
    }
    .form-wrap > p {
      margin-top: 0.45rem;
      color: var(--muted);
      font-size: 0.95rem;
    }
    form {
      display: grid;
      gap: 0.8rem;
      margin-top: 1.5rem;
    }
    label {
      display: grid;
      gap: 0.35rem;
      color: var(--ink);
      font-size: 0.95rem;
      font-weight: 800;
    }
    input {
      width: 100%;
      min-height: 2.75rem;
      padding: 0.7rem 0.85rem;
      border: 1px solid var(--line);
      border-radius: 0.65rem;
      color: var(--ink);
      font: inherit;
      outline: none;
    }
    input:focus {
      border-color: var(--green);
      box-shadow: 0 0 0 0.22rem rgba(74, 172, 58, 0.12);
    }
    .form-row {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      color: var(--muted);
      font-size: 0.9rem;
    }
    .form-row a { color: var(--green-dark); font-weight: 800; }
    button {
      min-height: 2.9rem;
      margin-top: 0.25rem;
      border: 0;
      border-radius: 99rem;
      background: var(--green);
      color: var(--white);
      font: inherit;
      font-weight: 900;
      cursor: pointer;
    
    }
    .switch {
      margin-top: 1.2rem;
      color: var(--muted);
      text-align: center;
      font-size: 0.95rem;
    }
    .switch a { color: var(--green-dark); font-weight: 900; }
    @media (max-width: 760px) {
      body { padding-top: 4.5rem; }
      .auth-shell { grid-template-columns: 1fr; margin-top: 5rem; }
      .auth-panel { padding: 1.8rem; }
      .auth-panel h1 { margin-top: 2rem; font-size: 2rem; }
      .form-wrap { padding: 1.8rem; }
    }
  </style>
</head>
<body>
  <a href="index.html" class="logo"><img src="logo3.png" alt="Kindr logo"></a>
  <main class="auth-shell">
    <section class="auth-panel">
      <div class="panel-mark"><span></span> Kindr.</div>
      <h1>Welcome back to your fundraising dashboard.</h1>
      <p>Sign in to manage campaigns, track donations, post updates, and stay connected with supporters.</p>
    </section>

    <section class="form-wrap">
      <h2>Sign in</h2>
      <p>Use your registered email address to continue.</p>

      <form data-login-form>
        <label>Email address <input name="email" type="email" placeholder="you@example.com" required></label>
        <label>Password <input name="password" type="password" placeholder="Enter your password" required></label>
        <div class="form-row">
          <span><input type="checkbox" style="width:auto; min-height:auto;"> Remember me</span>
          <a href="#">Forgot password?</a>
        </div>
        <button type="submit">Sign in</button>
      </form>

      <p class="switch">New to FundGuru? <a href="register.html">Create an account</a></p>
    </section>
  </main>
<script src="app.js"></script></body>
</html>
