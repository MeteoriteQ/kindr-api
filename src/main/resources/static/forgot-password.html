<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Forgot Password | Kindr</title><style>
*{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:1rem;background:#f7faf7;color:#222;font-family:Calibri,Arial,sans-serif}.box{width:min(100%,30rem);max-width:30rem;padding:2.4rem;background:#fff;border-radius:1rem;box-shadow:0 24px 70px #22222224}h1{margin:0;font-size:2rem}p{color:#68727d;line-height:1.5}label{display:grid;gap:.4rem;font-weight:700}input{width:100%;padding:.8rem;border:1px solid #ddd;border-radius:.5rem;font:inherit}button{width:100%;margin-top:1rem;padding:.8rem;border:0;border-radius:2rem;background:#f47600;color:#fff;font:inherit;font-weight:700;cursor:pointer}.message{min-height:1.4rem;color:#b42318}.success{color:#157347}a{color:#363636;font-weight:700}</style></head><body>
    <main class="box">
        <h1>Reset your password</h1>
        
        <p>Enter your registered email address and we will send you a secure reset link.</p>
        <form data-password-form>
            <label>Email address<input name="email" type="email" required autocomplete="email"></label>
            
            <p class="message" data-message></p>
            <button type="submit">Send reset link</button>
        </form>
        </main><script src="password-reset.js"></script></body></html>
